# Codecov configuration
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    project:
      default:
        target: 95%  # Overall project coverage target
        threshold: 2%  # Allow up to 2% drop in coverage
        
    patch:
      default:
        target: 95%  # Patch coverage target (new code in PR)
        threshold: 3%  # Allow up to 3% deviation for patches
        
  precision: 2
  round: down
  range: "70...100"

# Ignore certain files from coverage requirements
ignore:
  - "src/test-setup.ts"
  - "**/*.test.tsx"
  - "**/*.test.ts"
  - "vitest.config.ts"

# Comment formatting
comment:
  layout: "reach,diff,flags,tree,files"
  behavior: default
  require_changes: false
  
# Allow some lines to be uncovered without failing
# Particularly useful for animation/motion libraries and edge cases
parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no
